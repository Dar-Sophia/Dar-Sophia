<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السلة وإتمام الطلب | دار صوفيا</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=53">
    <style>
        .zone-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .zone-opt{position:relative;display:block;cursor:pointer}
        .zone-opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
        .zone-box{display:flex;flex-direction:column;gap:4px;height:100%;padding:14px 16px;border:2px solid var(--border-color);border-radius:16px;background:var(--white);transition:border-color .2s,background .2s,box-shadow .2s}
        .zone-box b{font-size:1rem;color:var(--text-color)}
        .zone-box small{font-size:.78rem;line-height:1.5;color:var(--gray)}
        .zone-box em{font-style:normal;font-weight:700;color:var(--primary);margin-top:2px}
        .zone-opt:hover .zone-box{border-color:var(--primary-light)}
        .zone-opt input:checked + .zone-box{border-color:var(--primary);background:var(--tint);box-shadow:0 6px 18px -10px var(--primary)}
        .zone-opt input:focus-visible + .zone-box{outline:2px solid var(--primary);outline-offset:2px}
        @media (max-width:420px){.zone-options{grid-template-columns:1fr}}
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container header-container">
            <div class="logo"><a href="index.html"><img class="logo-img" src="images/logo.png" alt="" width="42" height="42"><span class="logo-text">دار صوفيا</span></a></div>
            <div class="header-actions">
                <button type="button" id="darkModeToggle" class="cart-icon-btn" title="تغيير المظهر" aria-label="تغيير المظهر"><i class="fa-solid fa-moon"></i></button>
                <a href="index.html#products" class="btn-details"><i class="fa-solid fa-arrow-right"></i> متابعة التسوق</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding:48px 24px 88px;">
        <div class="co-title"><h1>سلة التسوق</h1><span id="itemsCount"></span></div>

        <div class="co-layout">
            <div>
                <div class="co-card">
                    <div id="cartItemsContainer"></div>
                </div>

                <div class="co-card">
                    <h2>بيانات التوصيل</h2>
                    <form id="checkoutForm" class="co-form" onsubmit="submitOrder(event)">
                        <div class="co-field"><label for="clientName">الاسم الكامل</label><input type="text" id="clientName" required autocomplete="name" placeholder="اكتبي اسمك الثلاثي"></div>
                        <div class="co-field"><label for="clientPhone">رقم الهاتف (واتساب)</label><input type="tel" id="clientPhone" required autocomplete="tel" placeholder="010xxxxxxxx"></div>
                        <div class="co-field full"><label for="clientCity">المحافظة / المدينة</label><input type="text" id="clientCity" required placeholder="مثال: القاهرة، الجيزة..."></div>
                        <div class="co-field full"><label for="clientAddress">العنوان بالتفصيل</label><textarea id="clientAddress" required rows="3" placeholder="الشارع، رقم العقار، الدور..."></textarea></div>
                        <div class="co-field full">
                            <label>منطقة الشحن</label>
                            <div class="zone-options" role="radiogroup" aria-label="منطقة الشحن">
                                <label class="zone-opt"><input type="radio" name="shipZone" value="north" required><span class="zone-box"><b>وجه بحري</b><small>القاهرة، الجيزة، الإسكندرية، الدلتا ومدن القناة</small><em data-zone-price="north"></em></span></label>
                                <label class="zone-opt"><input type="radio" name="shipZone" value="south" required><span class="zone-box"><b>وجه قبلي</b><small>من الفيوم وبني سويف جنوبًا حتى أسوان</small><em data-zone-price="south"></em></span></label>
                            </div>
                        </div>

                    </form>
                </div>
            </div>

            <aside class="co-card co-summary">
                <h2>ملخص الطلب</h2>
                <div class="co-row"><span>مجموع المنتجات</span><span id="cartSubtotal">0 ج.م</span></div>
                <div class="co-row"><span>الشحن</span><span id="cartShipping">0 ج.م</span></div>
                <div class="co-row total"><span>الإجمالي</span><span id="cartTotalPrice">0 ج.م</span></div>
                <button type="submit" form="checkoutForm" class="btn btn-wa-big"><i class="fa-brands fa-whatsapp"></i> تأكيد الطلب عبر واتساب</button>
                <div class="co-note"><i class="fa-solid fa-circle-info"></i><span>هيتفتح واتساب برسالة جاهزة فيها طلبك. الدفع عند الاستلام.</span></div>
            </aside>
        </div>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="products-data.js?v=53"></script>
    <script src="script.js?v=53"></script>
    <script>
        // أسعار الشحن حسب المنطقة (غيّري الأرقام من هنا)
        const SHIPPING_ZONES = {
            north: { label: 'وجه بحري', price: 80 },
            south: { label: 'وجه قبلي', price: 110 }
        };
        function currentZone() {
            const r = document.querySelector('input[name="shipZone"]:checked');
            return r ? SHIPPING_ZONES[r.value] : null;
        }

        function renderCheckoutCart() {
            const container = document.getElementById('cartItemsContainer');
            const subtotal = cartSubtotal();
            const zone = currentZone();
            const shipping = cart.length && zone ? zone.price : 0;
            const count = cart.reduce((s, i) => s + i.quantity, 0);

            container.innerHTML = cart.length ? cart.map(item => `
                <div class="co-item">
                    <img src="${escapeHtml(item.image)}" alt="" onerror="${IMG_FALLBACK}">
                    <div class="co-item-info">
                        <h4>${escapeHtml(item.name)}</h4>
                        <span class="co-unit">${item.price} ج.م للقطعة</span>
                    </div>
                    <div class="qty-box">
                        <button type="button" data-qty="${item.id}" data-d="1" aria-label="زيادة">+</button>
                        <span>${item.quantity}</span>
                        <button type="button" data-qty="${item.id}" data-d="-1" aria-label="نقصان">−</button>
                    </div>
                    <strong class="co-line">${item.price * item.quantity} ج.م</strong>
                    <button type="button" class="co-remove" data-remove="${item.id}" aria-label="حذف"><i class="fa-solid fa-xmark"></i></button>
                </div>`).join('')
                : '<div class="co-empty"><i class="fa-solid fa-bag-shopping"></i><h3>سلتك فاضية</h3><p>ابدئي بإضافة منتج من المتجر.</p><a href="index.html#products" class="btn btn-primary">تسوّقي الآن</a></div>';

            document.getElementById('itemsCount').textContent = count ? `(${count} منتج)` : '';
            document.getElementById('cartSubtotal').textContent = subtotal + ' ج.م';
            document.getElementById('cartShipping').textContent = !cart.length ? '0 ج.م' : (zone ? shipping + ' ج.م' : 'اختاري المنطقة');
            document.getElementById('cartTotalPrice').textContent = (subtotal + shipping) + ' ج.م';
        }

        document.getElementById('cartItemsContainer').addEventListener('click', e => {
            const q = e.target.closest('[data-qty]'), r = e.target.closest('[data-remove]');
            if (q) changeCartQty(q.dataset.qty, +q.dataset.d);
            else if (r) removeFromCart(r.dataset.remove);
            else return;
            renderCheckoutCart();
        });

        function submitOrder(e) {
            e.preventDefault();
            if (!cart.length) { showToast('سلة التسوق فارغة!'); return; }

            const val = id => document.getElementById(id).value.trim();
            const phone = val('clientPhone').replace(/[\s-]/g, '');
            if (!/^(\+?20|0)?1[0125]\d{8}$/.test(phone)) { showToast('رقم الهاتف غير صحيح'); document.getElementById('clientPhone').focus(); return; }

            const zone = currentZone();
            if (!zone) { showToast('اختاري منطقة الشحن (وجه بحري أو قبلي)'); return; }
            const subtotal = cartSubtotal();
            const shipCost = zone.price;
            let text = `*طلب جديد من متجر دار صوفيا* 🌿\n\n`;
            text += `👤 *الاسم:* ${val('clientName')}\n📞 *الهاتف:* ${phone}\n🏙️ *المحافظة:* ${val('clientCity')}\n🚚 *منطقة الشحن:* ${zone.label}\n📍 *العنوان:* ${val('clientAddress')}\n\n🛍️ *المنتجات المطلوبة:*\n`;
            cart.forEach(i => { text += `- ${i.name} (الكمية: ${i.quantity}) - ${i.price * i.quantity} ج.م\n`; });
            text += `\n🛒 *مجموع المنتجات:* ${subtotal} ج.م\n🚚 *الشحن (${zone.label}):* ${shipCost} ج.م\n💰 *الإجمالي الكلي:* ${subtotal + shipCost} ج.م`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-zone-price]').forEach(el => { el.textContent = SHIPPING_ZONES[el.dataset.zonePrice].price + ' ج.م'; });
            document.querySelectorAll('input[name="shipZone"]').forEach(r => r.addEventListener('change', renderCheckoutCart));
            renderCheckoutCart();
        });
    </script>
    <script src="animations.js?v=3"></script>
</body>
</html>
